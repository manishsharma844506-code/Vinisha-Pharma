<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" fill="none">
  <defs>
    <!-- Frame Metallic Border Gradient -->
    <linearGradient id="sbFrameGrad" x1="0" y1="0" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="15%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#CBD5E1" />
      <stop offset="55%" stop-color="#94A3B8" />
      <stop offset="80%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Inner Metallic Rim Gradient -->
    <linearGradient id="sbInnerRim" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Signboard Main Gradient (Navy Sapphire -> Rich Teal -> Lush Emerald) -->
    <linearGradient id="sbBgGrad" x1="0" y1="140" x2="1200" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#022B42" />
      <stop offset="22%" stop-color="#02435F" />
      <stop offset="48%" stop-color="#03665A" />
      <stop offset="76%" stop-color="#058354" />
      <stop offset="100%" stop-color="#089958" />
    </linearGradient>

    <!-- Drop Shadow Filter for 3D Main Title -->
    <filter id="sb3dTitleShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#011624" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#01243A" flood-opacity="0.9" />
    </filter>

    <!-- Soft Glow Filter for Subtitle -->
    <filter id="sbSubGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#022030" flood-opacity="0.8" />
    </filter>

    <!-- 3D Logo Filters and Gradients -->
    <filter id="sbLogoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#011624" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022238" flood-opacity="0.4" />
    </filter>

    <linearGradient id="vpExtrudeWingLeft" x1="200" y1="50" x2="520" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#013A63" />
      <stop offset="25%" stop-color="#014F7A" />
      <stop offset="50%" stop-color="#025E73" />
      <stop offset="75%" stop-color="#02634D" />
      <stop offset="100%" stop-color="#024D36" />
    </linearGradient>

    <linearGradient id="vpExtrudeCross" x1="600" y1="100" x2="520" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#01426B" />
      <stop offset="30%" stop-color="#025E7D" />
      <stop offset="65%" stop-color="#036B52" />
      <stop offset="100%" stop-color="#055938" />
    </linearGradient>

    <linearGradient id="vpFrontWingLeft" x1="100" y1="40" x2="520" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D5BE1" />
      <stop offset="18%" stop-color="#007BEF" />
      <stop offset="38%" stop-color="#00A2E8" />
      <stop offset="58%" stop-color="#00B89C" />
      <stop offset="78%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#28C745" />
    </linearGradient>

    <linearGradient id="vpFrontCross" x1="720" y1="60" x2="520" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0099FF" />
      <stop offset="20%" stop-color="#00B4D8" />
      <stop offset="45%" stop-color="#00C49F" />
      <stop offset="75%" stop-color="#05C46B" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <linearGradient id="vpLeafOuter" x1="140" y1="120" x2="420" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0099FF" />
      <stop offset="30%" stop-color="#00C49F" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <linearGradient id="vpLeafInner" x1="300" y1="260" x2="480" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="vpSpecularLeft" x1="80" y1="30" x2="350" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#A5F3FC" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#67E8F9" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Vignette Overlay -->
    <radialGradient id="sbVignette" cx="50%" cy="50%" r="55%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.32" />
    </radialGradient>
  </defs>

  <!-- ========================================== -->
  <!-- 1. METALLIC CASING & FRAME                 -->
  <!-- ========================================== -->
  <!-- Outer Metallic Border -->
  <rect x="2" y="2" width="1196" height="276" rx="8" fill="url(#sbFrameGrad)" stroke="#475569" stroke-width="2" />

  <!-- Inner Dark Bevel Groove -->
  <rect x="8" y="8" width="1184" height="264" rx="5" fill="url(#sbInnerRim)" stroke="#334155" stroke-width="1.5" />

  <!-- Corner Rivets / Mounting Accents -->
  <circle cx="16" cy="16" r="3.5" fill="#CBD5E1" stroke="#334155" stroke-width="1" />
  <circle cx="1184" cy="16" r="3.5" fill="#CBD5E1" stroke="#334155" stroke-width="1" />
  <circle cx="16" cy="264" r="3.5" fill="#CBD5E1" stroke="#334155" stroke-width="1" />
  <circle cx="1184" cy="264" r="3.5" fill="#CBD5E1" stroke="#334155" stroke-width="1" />

  <!-- ========================================== -->
  <!-- 2. MAIN SIGNBOARD BODY (TEAL/EMERALD GRAD) -->
  <!-- ========================================== -->
  <rect x="13" y="13" width="1174" height="254" rx="4" fill="url(#sbBgGrad)" />

  <!-- Right Geometric Facets & Architectural Stripes (As in Original User Signboard) -->
  <polygon points="860,13 1187,13 1187,267 740,267" fill="rgba(16, 185, 129, 0.16)" />
  <polygon points="980,13 1187,13 1187,267 890,267" fill="rgba(255, 255, 255, 0.05)" />

  <!-- Fine Golden & Lime Accent Lines -->
  <line x1="910" y1="13" x2="1160" y2="267" stroke="#FACC15" stroke-width="2.5" opacity="0.85" />
  <line x1="950" y1="13" x2="1200" y2="267" stroke="#FDE047" stroke-width="1.8" opacity="0.75" />
  <line x1="990" y1="13" x2="1240" y2="267" stroke="#86EFAC" stroke-width="2" opacity="0.65" />
  <line x1="1030" y1="13" x2="1280" y2="267" stroke="#38BDF8" stroke-width="1.5" opacity="0.5" />

  <!-- Left Dark Cyan Depth Vignette -->
  <rect x="13" y="13" width="280" height="254" fill="url(#sbBgGrad)" opacity="0.25" />
  <rect x="13" y="13" width="1174" height="254" rx="4" fill="url(#sbVignette)" pointer-events="none" />

  <!-- ========================================== -->
  <!-- 3. OFFICIAL 3D VINISHA EMBLEM (LEFT SIDE)  -->
  <!-- ========================================== -->
  <g id="signboardEmblem" transform="translate(36, 28) scale(0.224)" filter="url(#sbLogoShadow)">
    <!-- 3D Extrusion Side Walls -->
    <path
      d="M 52 46 C 140 68 280 162 388 340 C 450 442 498 578 522 748 C 538 852 534 892 532 940 L 512 958 C 498 906 480 812 458 720 C 426 592 374 466 312 360 C 220 200 112 110 38 68 Z"
      fill="url(#vpExtrudeWingLeft)"
    />
    <path
      d="M 686 98 L 712 68 L 712 198 L 572 198 L 552 232 L 686 232 L 686 372 L 562 870 L 512 958 L 532 940 L 656 470 L 686 422 L 686 372 Z"
      fill="url(#vpExtrudeCross)"
    />
    <path d="M 512 958 L 532 940 L 550 962 L 528 978 Z" fill="#024D36" />

    <!-- Left Wing Front Face -->
    <path
      d="M 38 42 C 126 62 254 144 354 300 C 420 404 468 538 496 690 C 520 818 526 894 528 942 C 520 904 496 798 470 708 C 432 576 372 444 300 328 C 208 180 110 98 38 42 Z"
      fill="url(#vpFrontWingLeft)"
    />

    <!-- Botanical Pharmacy Stem -->
    <path
      d="M 126 196 C 168 258 226 354 290 468 C 348 574 402 708 438 820"
      stroke="url(#vpFrontWingLeft)"
      stroke-width="14"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Outer Laurel Leaves -->
    <g>
      <path d="M 108 178 C 70 162 48 198 72 232 C 98 262 144 246 156 222 C 146 200 128 184 108 178 Z" fill="url(#vpLeafOuter)" />
      <path d="M 104 184 C 82 174 68 198 84 218 C 100 236 130 224 136 210 Z" fill="#FFFFFF" opacity="0.45" />
    </g>
    <g>
      <path d="M 132 256 C 88 250 74 296 104 326 C 134 354 180 330 188 302 C 172 280 154 264 132 256 Z" fill="url(#vpLeafOuter)" />
      <path d="M 128 264 C 98 260 90 292 112 312 C 132 330 164 314 168 296 Z" fill="#FFFFFF" opacity="0.4" />
    </g>
    <g>
      <path d="M 166 348 C 120 354 116 404 150 434 C 182 460 228 434 232 402 C 214 378 192 358 166 348 Z" fill="url(#vpLeafOuter)" />
      <path d="M 162 356 C 132 362 130 394 154 416 C 178 434 208 416 210 394 Z" fill="#FFFFFF" opacity="0.38" />
    </g>
    <g>
      <path d="M 210 448 C 166 464 172 516 208 542 C 242 566 284 536 284 502 C 264 478 238 458 210 448 Z" fill="url(#vpLeafOuter)" />
      <path d="M 208 456 C 178 470 184 506 210 524 C 234 540 262 520 260 496 Z" fill="#FFFFFF" opacity="0.35" />
    </g>
    <g>
      <path d="M 264 546 C 224 572 238 626 278 646 C 314 666 352 632 346 596 C 324 570 294 554 264 546 Z" fill="url(#vpLeafOuter)" />
      <path d="M 264 556 C 238 578 248 614 278 628 C 304 640 328 616 322 590 Z" fill="#FFFFFF" opacity="0.35" />
    </g>
    <g>
      <path d="M 326 648 C 290 682 314 734 358 748 C 398 760 430 722 418 684 C 392 660 360 648 326 648 Z" fill="url(#vpLeafOuter)" />
      <path d="M 328 658 C 304 686 322 720 354 730 C 382 738 404 710 394 682 Z" fill="#FFFFFF" opacity="0.3" />
    </g>
    <g>
      <path d="M 212 708 C 220 666 272 654 322 674 C 362 692 380 730 366 756 C 322 778 252 770 212 708 Z" fill="#16A34A" />
      <path d="M 230 706 C 242 678 280 668 318 684 C 344 698 356 724 340 740 Z" fill="#4ADE80" opacity="0.5" />
    </g>

    <!-- Inner Cavity Leaves -->
    <g>
      <path d="M 252 248 C 230 206 274 176 304 200 C 330 224 320 268 290 280 C 274 268 262 258 252 248 Z" fill="url(#vpLeafInner)" />
      <path d="M 258 244 C 244 216 272 196 294 212 C 310 228 304 256 284 266 Z" fill="#FFFFFF" opacity="0.4" />
    </g>
    <g>
      <path d="M 276 332 C 262 290 306 268 334 290 C 358 312 344 354 314 366 C 298 354 286 342 276 332 Z" fill="url(#vpLeafInner)" />
      <path d="M 282 328 C 272 300 302 284 322 300 C 338 316 328 344 308 352 Z" fill="#FFFFFF" opacity="0.38" />
    </g>
    <g>
      <path d="M 312 422 C 306 376 352 358 378 384 C 400 410 382 454 348 462 C 334 448 322 434 312 422 Z" fill="url(#vpLeafInner)" />
      <path d="M 318 418 C 314 386 346 372 366 392 C 380 410 366 440 342 448 Z" fill="#FFFFFF" opacity="0.35" />
    </g>
    <g>
      <path d="M 358 518 C 354 472 402 460 424 490 C 442 518 420 560 388 566 C 374 550 364 534 358 518 Z" fill="url(#vpLeafInner)" />
      <path d="M 364 514 C 360 482 394 472 410 496 C 424 516 408 544 384 550 Z" fill="#FFFFFF" opacity="0.3" />
    </g>

    <!-- Right Wing & Medical Cross -->
    <path
      d="M 528 942 C 552 866 592 748 644 612 C 690 492 730 388 748 312 L 748 310 L 602 310 C 586 310 574 298 574 282 L 574 196 C 574 180 586 168 602 168 L 748 168 L 748 64 C 748 48 760 36 776 36 L 866 36 C 882 36 894 48 894 64 L 894 168 L 964 168 C 980 168 992 180 992 196 L 992 282 C 992 298 980 310 964 310 L 894 310 L 894 378 C 872 506 792 682 696 824 C 638 908 584 964 544 982 C 538 978 532 964 528 942 Z"
      fill="url(#vpFrontCross)"
    />

    <!-- Hollow Cutout Cross Window -->
    <path
      d="M 808 126 C 808 116 816 108 826 108 L 844 108 C 854 108 862 116 862 126 L 862 198 L 920 198 C 930 198 938 206 938 216 L 938 244 C 938 254 930 262 920 262 L 862 262 L 862 334 C 862 344 854 352 844 352 L 826 352 C 816 352 808 344 808 334 L 808 262 L 750 262 C 740 262 732 254 732 244 L 732 216 C 732 206 740 198 750 198 L 808 198 Z"
      fill="#013654"
      opacity="0.85"
    />
    <path
      d="M 814 132 C 814 126 818 120 826 120 L 844 120 C 850 120 856 126 856 132 L 856 204 L 914 204 C 920 204 926 210 926 216 L 926 242 C 926 248 920 254 914 254 L 856 254 L 856 326 C 856 332 850 338 844 338 L 826 338 C 818 338 814 332 814 326 L 814 254 L 756 254 C 750 254 744 248 744 242 L 744 216 C 744 210 750 204 756 204 L 814 204 Z"
      fill="#FFFFFF"
    />
    <path
      d="M 814 132 L 856 132 L 856 204 L 914 204 L 914 216 L 844 216 L 844 142 L 814 142 Z"
      fill="#01243A"
      opacity="0.35"
    />

    <!-- Specular Gloss Highlights -->
    <path
      d="M 44 46 C 124 64 246 142 344 290 C 386 352 422 428 448 510 C 424 430 384 354 336 288 C 246 160 144 88 44 46 Z"
      fill="url(#vpSpecularLeft)"
      opacity="0.9"
    />
    <path d="M 776 40 L 866 40 C 878 40 888 50 888 62 L 888 78 L 782 78 L 782 46 Z" fill="#FFFFFF" opacity="0.75" />
    <path d="M 890 172 L 960 172 C 972 172 982 180 984 192 L 890 192 Z" fill="#FFFFFF" opacity="0.65" />
    <path d="M 528 942 L 544 982 L 536 974 L 524 940 Z" fill="#86EFAC" opacity="0.8" />
  </g>

  <!-- ========================================== -->
  <!-- 4. CORE SIGNBOARD TYPOGRAPHY               -->
  <!-- ========================================== -->
  <!-- Main Title: VINISHA PHARMA in 3D White Emboss -->
  <!-- 3D Layer 1: Deep shadow extrusion underneath -->
  <text
    x="680"
    y="141"
    text-anchor="middle"
    fill="#011b27"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="68"
    font-weight="900"
    letter-spacing="5"
    opacity="0.95"
  >
    VINISHA PHARMA
  </text>
  <text
    x="680"
    y="139"
    text-anchor="middle"
    fill="#023854"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="68"
    font-weight="900"
    letter-spacing="5"
    opacity="0.9"
  >
    VINISHA PHARMA
  </text>
  <!-- 3D Layer 2: Main crisp white face with filter -->
  <text
    x="680"
    y="136"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="68"
    font-weight="900"
    letter-spacing="5"
    filter="url(#sb3dTitleShadow)"
  >
    VINISHA PHARMA
  </text>

  <!-- Subtitle: Medical & General Store in Sky Blue -->
  <!-- Subtle shadow for subtitle -->
  <text
    x="680"
    y="199"
    text-anchor="middle"
    fill="#011e2b"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="32"
    font-weight="800"
    letter-spacing="3"
    opacity="0.8"
  >
    Medical &amp; General Store
  </text>
  <text
    x="680"
    y="196"
    text-anchor="middle"
    fill="#38BDF8"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="32"
    font-weight="800"
    letter-spacing="3"
    filter="url(#sbSubGlow)"
  >
    Medical &amp; General Store
  </text>
</svg>
